name: Lecture material assignment
description: Track a lecture-note section assigned by the course team.
title: "[Lecture NN] Material — Short description"
labels: ["lecture-material"]
body:
  - type: markdown
    attributes:
      value: "The course team assigns this issue after note-taking sign-ups are finalized in the course Google Sheet."
  - type: input
    id: lecture
    attributes:
      label: Lecture
      placeholder: "Lecture 02 — Clustering and K-means"
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Assigned section
      description: Select the exact file slot this issue will own.
      options:
        - Course materials 1 (course-1.md)
        - Course materials 2 (course-2.md)
        - Optional topic 1 (optional-1.md)
        - Optional topic 2 (optional-2.md)
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Requested material
      description: Describe the notes, example, code, visual, or reference work expected in the pull request.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Review checklist
      value: |
        - [ ] Course team set `assignee` and `issue` in the assigned file on `main`
        - [ ] Technically accurate and written in the student's own words
        - [ ] Sources and reused assets are cited
        - [ ] Images include descriptive alt text
        - [ ] No homework, exam, grading, solution, or private information
        - [ ] Pull request links this issue

  - type: input
    id: file
    attributes:
      label: Exact assigned file
      description: Copy the full path from `_contributions/fall-2026/NN/`.
      placeholder: "_contributions/fall-2026/02/course-1.md"
    validations:
      required: true
