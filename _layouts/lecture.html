---
layout: default
---
<article class="lecture-page">
  <a class="back-link" href="{{ page.semester_url | relative_url }}">← {{ page.semester_label }} lectures</a>
  <header class="lecture-heading">
    <div>
      <p class="eyebrow">{{ page.semester_label }} · Lecture {{ page.number }} · {{ page.date | date: "%B %-d, %Y" }}</p>
      <h1>{{ page.title }}</h1>
      {% if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
    </div>
    <span class="status status-{{ page.status | default: 'planned' }}">{{ page.status | default: "planned" }}</span>
  </header>

  <div class="lecture-content prose">{{ content }}</div>
</article>
